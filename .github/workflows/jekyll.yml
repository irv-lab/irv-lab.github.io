name: Build & Deploy Jekyll site

permissions:
  contents: write      # repo 컨텐츠(코드)를 push 하기 위해 필요
  pages: write         # GitHub Pages 설정 갱신에 필요
  id-token: write      # peaceiris/actions-gh-pages 가 내부적으로 사용

on:
  push:
    branches:
      - source    # 소스 커밋이 발생하는 브랜치

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: source

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Python for Jupyter
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Jupyter
        run: pip install notebook

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --destination docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main      # 배포 전용 브랜치
          publish_dir: docs
          force_orphan: true
